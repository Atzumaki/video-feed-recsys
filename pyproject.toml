[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-feed-recsys"
version = "0.1.0"
description = "Two-stage neural recommender for a personalized short-video commerce feed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atzumaki" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]
data = ["polars>=1.12,<2", "pyspark>=3.5,<4"]
orchestration = ["apache-airflow>=2.10,<3"]

[project.scripts]
video-recsys = "video_recsys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_recsys"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

